<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- window -->
  <rect x="100" y="80" width="1400" height="828" rx="16" fill="#0a0d12" stroke="#30363d" stroke-width="2"/>

  <!-- titlebar -->
  <path d="M 100 96 a 16 16 0 0 1 16 -16 h 1368 a 16 16 0 0 1 16 16 v 44 h -1400 z" fill="#1c2128"/>
  <circle cx="144" cy="110" r="9" fill="#ff5f57"/>
  <circle cx="176" cy="110" r="9" fill="#febc2e"/>
  <circle cx="208" cy="110" r="9" fill="#28c840"/>
  <text x="800" y="120" text-anchor="middle" font-family="Menlo, Monaco, monospace" font-size="24" fill="#8b949e">agent — zsh</text>

  <g font-family="Menlo, Monaco, monospace" font-size="30">
    <!-- prompt -->
    <text x="156" y="196" fill="#7ee787">❯</text>
    <text x="196" y="196" fill="#e6edf3">agent</text>

    <!-- user request -->
    <text x="156" y="252" fill="#8b949e">›</text>
    <text x="196" y="252" fill="#e6edf3">show open issues in alexeyco/tea</text>

    <!-- tool call -->
    <text x="156" y="348" fill="#ffa657">●</text>
    <text x="196" y="348" fill="#e6edf3">tea issues ls -r alexeyco/tea</text>

    <!-- output -->
    <text x="156" y="444" fill="#79c0ff">#7</text>
    <text x="260" y="444" fill="#7ee787">open</text>
    <text x="400" y="444" fill="#c9d1d9">Support OpenCode plugin installs</text>

    <text x="156" y="494" fill="#79c0ff">#5</text>
    <text x="260" y="494" fill="#7ee787">open</text>
    <text x="400" y="494" fill="#c9d1d9">Add provenance to npm publish</text>

    <text x="156" y="544" fill="#79c0ff">#3</text>
    <text x="260" y="544" fill="#7ee787">open</text>
    <text x="400" y="544" fill="#c9d1d9">Handle multiple instance logins</text>

    <!-- answer -->
    <text x="156" y="640" fill="#e6edf3">3 open issues. <tspan fill="#8b949e">#7 and #5 are both about</tspan></text>
    <text x="156" y="690" fill="#e6edf3">packaging — want me to <tspan fill="#ffa657">comment on both</tspan>?</text>

    <!-- prompt again -->
    <text x="156" y="786" fill="#7ee787">❯</text>
    <rect x="196" y="762" width="18" height="34" fill="#7ee787"/>
  </g>
</svg>
